[package]
name = "sadhbh-c0d3/private-poker"
version = "0.1.5"
description = "Private Poker"

[dependencies]
"php/php" = "^8.3.4"

[fs]
"/app/dist" = "./dist"
"/app/server" = "./server"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/dist", "-S", "0.0.0.0:8080", "/app/server/router.php"]
