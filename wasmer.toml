[package]
name = "sadhbh-c0d3/private-poker-vite"
version = "0.2.2"
description = "Vite SPA hosted via PHP on Wasmer Edge"

[dependencies]
"php/php" = "^8.3.4"

[fs]
"/app/dist" = "./dist"
"/app/server" = "./server"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/dist", "-S", "0.0.0.0:8080", "/app/server/router.php"]
