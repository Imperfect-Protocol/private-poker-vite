[package]
name = "sadhbh-c0d3/private-poker"
version = "0.3.1"
description = "Private Poker (Vite)"

[dependencies]
"sadhbh-c0d3/edgejs-quickjs" = "^0.2.0"

[fs]
"/dist" = "./"

[[command]]
name = "run"
module = "sadhbh-c0d3/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/dist/server/standalone-entry.js"]
